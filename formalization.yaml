    "name": "Homogeneous polynomial approximation on symmetric convex bodies",
    "description": "For every origin-symmetric convex body with nonempty interior in a finite-dimensional real Euclidean space, continuous real boundary functions admit uniform approximation by real homogeneous polynomials of consecutive degrees. The development proves all thirteen principal results of the cited manuscript, including parity approximation, dimension-only uniform approximation of the constant function, homogeneous Gaussian kernels with polynomially weighted errors, fixed-bandwidth one-sided weighted density, tensor density, Gaussian Fourier cutoff, convex weighted approximation, finite-family selection and positive spherical quadrature. The thirteen declarations and their conjunction are compared against an independent self-contained Challenge using only the standard three Lean axioms.",
